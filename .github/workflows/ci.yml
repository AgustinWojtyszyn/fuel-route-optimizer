name: Python API checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Django configuration and migrations
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Independent optimizer and verification tests
        run: python -m unittest discover -s tests -v
      - name: Django integration tests with mocked provider
        run: python manage.py test routes -v 1
      - name: Validate OpenAPI reference
        run: python -m json.tool docs/openapi.json > /dev/null
      - name: Verify demo JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('routes/templates/routes/demo.html').read_text()
          script = re.search(r'<script>\\s*(.*?)\\s*</script>', html, re.S)
          assert script is not None
          Path('/tmp/fuel_route_demo.js').write_text(script.group(1))
          PY
          node --check /tmp/fuel_route_demo.js
      - name: Compile source
        run: python -m compileall -q config routes scripts tests
