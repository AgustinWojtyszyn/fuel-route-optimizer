<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fuel route planner</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{font:16px system-ui;margin:1rem;max-width:1100px}form{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}input{width:9rem;padding:.5rem}button{padding:.5rem}#map{height:60vh;min-height:350px}#result{white-space:pre-wrap}</style></head><body><h1>Fuel route planner</h1><form id="form"><input name="sc" value="Chicago" aria-label="Start city"><input name="ss" value="IL" aria-label="Start state"><input name="fc" value="Denver" aria-label="Finish city"><input name="fs" value="CO" aria-label="Finish state"><button>Calculate</button></form><div id="map"></div><pre id="result"></pre><p>City centers approximate station locations; check station access before travel. Map data © OpenStreetMap contributors. City locations: GeoNames CC BY 4.0.</p><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const map=L.map('map').setView([39,-98],4);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:18}).addTo(map);let layer;document.querySelector('#form').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const r=await fetch('/api/v1/routes/optimize/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({start:{city:f.get('sc'),state:f.get('ss')},finish:{city:f.get('fc'),state:f.get('fs')}})});const data=await r.json();if(layer)map.removeLayer(layer);if(!r.ok){document.querySelector('#result').textContent=JSON.stringify(data,null,2);return}layer=L.featureGroup().addTo(map);L.geoJSON(data.route.geometry).addTo(layer);for(const s of data.stops)(()=>{const popup=document.createElement("span");popup.textContent=`${s.name}: $${s.price_usd_per_gallon}/gal; buy ${s.gallons_to_buy} gal (approximate city location)`;return L.marker([s.lat,s.lon]).bindPopup(popup).addTo(layer)})();map.fitBounds(layer.getBounds());document.querySelector('#result').textContent=`${data.route.distance_miles} mi · ${data.stops.length} fuel stops · $${data.fuel.purchased_en_route_usd} en route · $${data.fuel.estimated_total_trip_cost_usd} estimated consumed fuel\n${data.meta.warnings.join('\n')}`}</script></body></html>
